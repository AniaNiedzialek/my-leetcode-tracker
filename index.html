<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leetcode Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">

</head>
<body>

  <h1>Welcome to My Leetcode Tracker!</h1>

  <p>
    This website helps me track my Leetcode progress.
    Choose a pattern below or add a new question.
  </p>

  <section class ="auth-card">
    <h2>Account</h2>
    <p id="auth-status">Not logged in</p>

    <input type='email' id='emailInput' placeholder='Email' />
    <input type='password' id='passwordInput' placeholder='Password' />
    <div class="auth-buttons">
        <button id="signUpBtn">Sign Up</button>
        <button id="loginBtn">Login</button>
        <button id="logoutBtn">Logout</button>
    </div>
  </section>

  <button id="openAddQuestionBtn" class="add-question-btn">
    <lottie-player
    src="assets/printer.json"
    background="transparent"
    speed="1"
    loop
    autoplay></lottie-player>
    <span>Craft a Question</span>

  </button>

  <h2>Explore Patterns</h2>

  <div id="patternList" class="pattern-list"></div>

  <hr />

  <h2 id="selectedPatternTitle">Select a pattern</h2>

  <div id="questionsContainer" class="questions-container"></div>

  <!-- Add Question Popup -->
  <div id="addQuestionPopup" class="popup">
    <div class="popup-content large-popup">
      <span id="closeAddQuestionBtn" class="close">&times;</span>

      <h2>Craft a Question</h2>

      <form id="questionForm">
        <label>
          Question Title:
          <input 
            type="text" 
            id="questionTitle" 
            placeholder="Example: #112 Path Sum" 
            required
          />
        </label>

        <label>
          Pattern:
          <select id="questionPattern" required>
            <option value="">Choose a pattern</option>
          </select>
        </label>

        <label>
          Core Idea:
          <textarea id="coreIdea" required></textarea>
        </label>

        <label>
          Base Case:
          <textarea id="baseCase"></textarea>
        </label>

        <label>
          Return Logic:
          <textarea id="returnLogic"></textarea>
        </label>

        <label>
          Time Complexity:
          <input 
            type="text" 
            id="timeComplexity" 
            placeholder="Example: O(n)"
          />
        </label>

        <label>
          Space Complexity:
          <input 
            type="text" 
            id="spaceComplexity" 
            placeholder="Example: O(h)"
          />
        </label>

        <label>
          Additional Comments:
          <textarea id="additionalComments"></textarea>
        </label>

        <button type="submit">Save Question</button>
      </form>
    </div>
  </div>

  <!-- View Question Popup -->
  <div id="viewQuestionPopup" class="popup">
    <div class="popup-content large-popup">
      <span id="closeViewQuestionBtn" class="close">&times;</span>

      <h2 id="popupQuestionTitle"></h2>

      <p><strong>Pattern:</strong> <span id="popupPattern"></span></p>
      <p><strong>Core Idea:</strong> <span id="popupCoreIdea"></span></p>
      <p><strong>Base Case:</strong> <span id="popupBaseCase"></span></p>
      <p><strong>Return Logic:</strong> <span id="popupReturnLogic"></span></p>
      <p><strong>Time:</strong> <span id="popupTime"></span></p>
      <p><strong>Space:</strong> <span id="popupSpace"></span></p>
      <p><strong>Additional Comments:</strong> <span id="popupComments"></span></p>
    </div>
  </div>

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <!-- <script src="script.js"></script> -->
   <script type="module" src="script.js"></script>
</body>
</html>
