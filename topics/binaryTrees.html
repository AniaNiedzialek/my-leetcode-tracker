<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Binary Trees</title>
</head>
<body>
    <h1>Binary Trees</h1>

    <p>Binary trees are a fundamental data structure in computer science.</p>

    <p>Topics:</p>


    <button class="open-popup-btn"
    data-title="Question #112. Path Sum"
    data-message="Pattern: Binary Tree DFS
    Core idea: Recursively explore all paths from the root to the leaves, keeping track of the current path sum.
    Base case: If the current node is null, return false.
    Return logic: If a leaf node is reached, check if the current path sum equals the target sum.
    Time: O(n), because each node is visited once.
    Space: O(h), because the recursion stack depends on the height of the tree.
    ">
    Open #112. Path Sum
    </button>

    
    <button class="open-popup-btn"
    data-title="Question #129. Lowest Common Ancestor"
    data-message="Pattern: Binary Tree DFS
    <Core-idea: Recursively move down the tree while building the current number from the root to the current node.
    Base-case: If the node is a leaf, return the full number created by that root-to-leaf path.
    Return logic: Return the left subtree result plus the right subtree result, because we need the sum of all root-to-leaf numbers.
    Time: O(n), because each node is visited once.
    Space: O(h), because the recursion stack depends on the height of the tree.
    ">
    Open #129. Lowest Common Ancestor
    </button>

    <button class="open-popup-btn"
    data-title="Question #236. Lowest Common Ancestor"
    data-message="Pattern: Binary Tree DFS
    Core idea: Recursively find the lowest common ancestor (LCA) of two nodes.
     Base case: if the root contains either p or q or if its null - return the current root
     Return logic: If both left and right subtrees contain one of the nodes, the current root is the LCA.
     Time: O(n), because each node is visited once.
     Space: O(h), because the recursion stack depends on the height of the tree.
   ">
   Open #236. Lowest Common Ancestor
   </button>

   <!-- add more buttons -->

        <span id="closePopupBtn" class="close">&times;</span>
        <h2 id="popupTitle"></h2>
        <p id="popupMessage"></p>
    </div>
   </div>

   <script src="../script.js"></script>

</body>
</html>
